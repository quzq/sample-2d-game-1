<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sample-2d-game-1</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="screen-wrap" aria-label="Game screen">
        <canvas id="game" width="256" height="240"></canvas>
      </section>

      <section class="help" aria-label="Controls">
        <p><strong>Move:</strong> Left / Right / A / D</p>
        <p><strong>Jump:</strong> Space / Z</p>
        <p><strong>Pause:</strong> P</p>
        <p><strong>Restart:</strong> R</p>
      </section>
    </main>

    <script src="src/main.js"></script>
  </body>
</html>
